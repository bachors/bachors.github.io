white/5 rounded-2xl p-5 shadow-sm hover:shadow-md transition-shadow"><div class="flex items-center gap-3 mb-3"><div class="w-10 h-10 rounded-xl bg-blue-50 dark:bg-blue-400/10 flex items-center justify-center"><i class="fa fa-chart-line text-blue-500 dark:text-blue-400"></i></div><div><p class="font-semibold text-gray-900 dark:text-white text-sm">Statistik Aplikasi</p><p class="text-xs text-gray-400 dark:text-gray-500">Google Play \xb7 AdMob</p></div></div><div class="border-t border-gray-100 dark:border-white/5 pt-3 grid grid-cols-2 gap-3">${stat("fa-download","Download","500 rb+")}${stat("fa-clock","Update",formatTime(e))}${stat("fa-star-half-stroke","Rating","4,8 ★")}${stat("fa-comment-dots","Ulasan","10 rb+")}</div></div>`;a.insertAdjacentHTML("afterbegin",s+r)}async function fetchData(){try{let t=await fetch("https://script.google.com/macros/s/AKfycbxWqv8sfrNtuqkJ281wRBkiftm_6e7zcAe-oTKzrWs3grLG858sBsYQ2_cpJhBxnHZuQQ/exec",{method:"POST",body:new URLSearchParams({username:"bachors"})});if(!t.ok)throw Error(`HTTP ${t.status}`);let e=await t.json();renderCards(e.data,e.last_update)}catch(a){}}function formatTime(t){let[e,a]=t.split(":").map(Number),r=e>=12?"PM":"AM";return 0==(e%=12)&&(e=12),`${String(e).padStart(2,"0")}:${String(a).padStart(2,"0")} ${r}`}updateThemeIcon(),fetchData();const audio=document.getElementById("bgMusic");audio.play().catch(()=>{let t=()=>{audio.play(),document.removeEventListener("click",t),document.removeEventListener("scroll",t)};document.addEventListener("click",t),document.addEventListener("scroll",t)});</script>
