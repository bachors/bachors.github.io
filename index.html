<body class="bg-gray-100 text-gray-700 dark:bg-[#131313] dark:text-gray-200 text-base min-h-screen p-4 md:p-8 transition-colors duration-300">

  <script>
    const API_URL = 'https://script.google.com/macros/s/AKfycbxWqv8sfrNtuqkJ281wRBkiftm_6e7zcAe-oTKzrWs3grLG858sBsYQ2_cpJhBxnHZuQQ/exec';

    const LABELS = {
      today: 'Sepanjang hari Ini',
      yesterday: 'Kemarin',
      seven_day: '7 hari terakhir',
      twentyeight_day: '28 hari terakhir',
      this_month: 'Selama bulan ini',
      last_month: 'Bulan lalu',
      all_time: 'Semua waktu'
    };

    function updateThemeIcon() {
      document.getElementById('theme-icon').textContent =
        document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    }

    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      localStorage.theme = isDark ? 'dark' : 'light';
      updateThemeIcon();
    }

    updateThemeIcon();

    function stat(label, value) {
      return `
        <div>
          <p class="text-sm font-semibold tracking-wide">${label}</p>
          <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${value}</p>
        </div>`;
    }

    function renderCards(data, last_update) {
      const container = document.getElementById('cards');
      let el = Object.entries(data).map(([key, d], i) => `
        <div class="bg-white dark:bg-[#1e1f21] rounded-2xl p-5 shadow-lg">
          <div class="grid grid-cols-2 gap-2 mb-2">
            <div>
              <i class="text-3xl fa fa-coins text-gray-700/30 dark:text-gray-200/30"></i>
            </div>
            <div>
              <p class="text-sm font-semibold tracking-wide">${LABELS[key] || key}</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">${d.date_range.replace("-", "•")}</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            ${stat('Peristiwa', d.ad_requests)}
            ${stat('Pendapatan', d.earnings)}
            ${stat('Tayangan', d.ad_impressions)}
            ${stat('eCPM', d.ecpm)}
          </div>
        </div>
      `).join('');
      const us = `
        <div class="bg-white dark:bg-[#1e1f21] rounded-2xl pl-5 pt-5 pr-5 pb-5 shadow-lg">
          <div class="grid grid-cols-2 gap-2 mb-2">
            <div>
              <i class="fa fa-chart-line text-3xl text-gray-700/30 dark:text-gray-200/30 mb-2"></i>
              <p class="text-sm font-semibold tracking-wide">Sumber</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">Google Play • AdMob</p>
            </div>
            <div>
              <p class="text-sm font-semibold tracking-wide">Update</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5 mb-2">${formatTime(last_update)}</p>
              <p class="text-sm font-semibold tracking-wide">Install</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">500 rb+</p>
            </div>
          </div>
          <div class="grid grid-cols-2 gap-2">
            <div>
              <p class="text-sm font-semibold tracking-wide">Ulasan</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">10 rb+</p>
            </div>
            <div>
              <p class="text-sm font-semibold tracking-wide">Rating</p>
              <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">4,8★</p>
            </div>
          </div>
        </div>
      `;
      container.insertAdjacentHTML('afterbegin', us + el);
    }

    async function fetchData() {
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          body: new URLSearchParams({
            username: 'bachors'
          })
        });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const json = await res.json();
        renderCards(json.data, json.last_update);
      } catch (e) {
        const el = document.getElementById('error');
        el.textContent = `Gagal memuat data: ${e.message}`;
        el.classList.remove('hidden');
      }
    }

    function formatTime(str) {
      let [h, m] = str.split(':').map(Number);
      const period = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12; // jam 0 atau 12 jadi "12"

      const hh = String(h).padStart(2, '0');
      const mm = String(m).padStart(2, '0');

      return `${hh}:${mm} ${period}`;
    }

    fetchData();
  </script>
