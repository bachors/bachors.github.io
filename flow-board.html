  .avatar {
    position: absolute;
    inset: 0 auto auto 0;
    display: grid;
    place-items: center;
    inline-size: 44px;
    aspect-ratio: 1;

    translate: calc((1 - var(--ae, 0)) * (1 - var(--v)) * 30px + var(--ae, 0) * (var(--W) * 1px - (1 - var(--v)) * 30px) - 22px)
               calc((1 - var(--ae, 0)) * var(--v) * 30px + var(--ae, 0) * (var(--H) * 1px - var(--v) * 30px) - 22px);
    scale: var(--fx) var(--fy);
    border: 3px solid var(--ca);
    transform-origin: 22px 22px;
    border-radius: 50%;
    background: oklch(93% .03 80);
    box-shadow: 0 0 0 3px black;
    font: 25px/1 "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif;
    padding: 0;
    color: black;
    cursor: pointer;
    pointer-events: auto;   
    transition: scale 160ms;
    &::before { counter-reset: em var(--em); content: counter(em, avatar); }
    &:hover { scale: calc(var(--fx) * 1.12) calc(var(--fy) * 1.12); }
    &:focus-visible { outline: 2px solid white; outline-offset: 3px; }
  }
